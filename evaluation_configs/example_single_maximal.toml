[evaluator_params.efficiency_utility]
granularity = "normal"
threshold = 0.8
include_semantic_utility = true
coherence_prompt_id = "baseline_v1"
distinctiveness_prompt_id = "baseline_v1"
semantic_snapshot_mode = "all"

[evaluator_params.efficiency_utility.model_config]
model = "openai/gpt-5.4-mini"
base_url = "https://openrouter.ai/api/v1"
provider_order = []
allow_fallbacks = true
api_key_env = "OPENROUTER_API_KEY"
temperature = 0.0

[evaluator_params.human_effort_metrics]

[evaluator_params.inferred_theme_efficiency_utility]
granularity = "normal"
threshold = 0.8
include_semantic_utility = true
theme_match_prompt_id = "baseline_v1"
coherence_prompt_id = "baseline_v1"
distinctiveness_prompt_id = "baseline_v1"
semantic_snapshot_mode = "all"

[evaluator_params.inferred_theme_efficiency_utility.model_config]
model = "openai/gpt-5.4-mini"
base_url = "https://openrouter.ai/api/v1"
provider_order = []
allow_fallbacks = true
api_key_env = "OPENROUTER_API_KEY"
temperature = 0.0

[evaluator_params.label_groundtruth_consistency]
ground_truth_label_column = "label"

[evaluator_params.semantic_consistency]
num_samples = 5
inference_prompt_id = "baseline_v1"
judge_prompt_id = "baseline_v1"

[evaluator_params.semantic_consistency.model_config]
model = "openai/gpt-5.4-mini"
base_url = "https://openrouter.ai/api/v1"
provider_order = []
allow_fallbacks = true
api_key_env = "OPENROUTER_API_KEY"
temperature = 0.0

[evaluator_params.topic_conditioned_quality]
granularity = "normal"
theme_match_prompt_id = "baseline_v1"

[evaluator_params.topic_conditioned_quality.model_config]
model = "openai/gpt-5.4-mini"
base_url = "https://openrouter.ai/api/v1"
provider_order = []
allow_fallbacks = true
api_key_env = "OPENROUTER_API_KEY"
temperature = 0.0
