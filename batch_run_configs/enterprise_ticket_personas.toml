values = [
  { prompt_id = "baseline_v4", persona = "task_oriented", topic_discovery = { enabled = true, trigger_mode = "turn_budget", turn_budget = 3, max_rounds = 3, min_new_topics_per_round = 2 } },
  { prompt_id = "baseline_v4", persona = "casual_social", topic_discovery = { enabled = true, trigger_mode = "turn_budget", turn_budget = 3, max_rounds = 3, min_new_topics_per_round = 2 } },
