output_dir = "data/batch_run_results/human_agent_consistency"
num_runners = 8
reporter = "null"

[base]
name = "human agent consistency"
dataset_name = "synthetic"
clustering_agent_backend = "backend_v1"
limit = 100
max_turns = 12
num_runs = 16

[base.human_agent_config]
prompt_id = "baseline_v2"
guidance = "device type"

[base.clustering_agent_backend_config]
prompt_id = "baseline_v1"

[sweep]
vary_by = "human_agent_model_config"
values = [
    { model = "openai/gpt-5.2" },
    { model = "openai/gpt-5-mini" },
    { model = "x-ai/grok-4" },
    { model = "x-ai/grok-4.1-fast" },
    { model = "google/gemini-3.1-pro-preview" },
    { model = "google/gemini-3-flash-preview" },
    { model = "anthropic/claude-sonnet-4.6" },
    { model = "anthropic/claude-haiku-4.5" },
    { model = "moonshotai/kimi-k2.5", provider_order = ["baseten/fp4", "fireworks"], allow_fallbacks = false},
    { model = "z-ai/glm-5", provider_order = ["fireworks", "together" ], allow_fallbacks = false },
    { model = "deepseek/deepseek-v3.2", provider_order = ["google-vertex", "novita/fp8"], allow_fallbacks = false }
]
