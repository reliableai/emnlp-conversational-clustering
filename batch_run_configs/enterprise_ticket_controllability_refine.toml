output_dir = "data/batch_run_results/enterprise_ticket_controllability_refine"
num_runners = 16
reporter = "batch_progress"

[base]
name = "enterprise_ticket_controllability_refine"
dataset_name = "enterprise_ticket"
clustering_agent_backend = "instruction_kmeans_v1"
enable_intermittent_clustering = true
max_turns = 12
num_runs = 10
random_seed = 42

[base.metadata]
experiment_axis = "refinement_controllability"
description = "Enterprise ticket refinement controllability run with shared prefixes and early, middle, and late fine-grained regrouping requests."

[base.human_agent_config]
prompt_id = "baseline_v2"
guidance = "Group tickets by the primary request type or problem category expressed by the ticket."

[base.human_agent_config.turn_injection]
turn_index = 4
edit_primitive = "refine"

[base.human_agent_model_config]
model = "openai/gpt-5.4"

[base.human_verifier_model_config]
model = "openai/gpt-5.4-mini"
temperature = 0.0

